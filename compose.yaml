services:
  db:
    image: postgres:17.7-alpine
    environment:
      POSTGRES_DB: partsroute
      POSTGRES_USER: partsroute
      POSTGRES_PASSWORD: partsroute
    ports: ["127.0.0.1:5432:5432"]
    volumes: ["partsroute_db:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U partsroute"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  partsroute_db:
