# Default card-free setup. Paid separate services require render.paid.yaml.
# DATABASE_URL must use an external persistent Postgres database, such as the
# Supabase session pooler. Render's own free database expires after 30 days.
services:
  - type: web
    name: partsroute
    runtime: node
    plan: free
    region: singapore
    buildCommand: corepack enable && pnpm install --frozen-lockfile --prod=false && pnpm build
    startCommand: node scripts/start-hosted.mjs
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 24.19.0
      - key: NODE_ENV
        value: production
      - key: NEXT_TELEMETRY_DISABLED
        value: "1"
      - key: NODE_EXTRA_CA_CERTS
        value: certs/supabase-prod-ca-2021.crt
      - key: DATABASE_URL
        sync: false
      - key: TINYFISH_API_KEY
        sync: false
      - key: AI_PROVIDER
        value: gemini
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-3.5-flash-lite
      - key: APP_ACCESS_TOKEN
        sync: false
      - key: LIVE_QUOTES_PER_HOUR
        value: "0"
