# Optional paid setup. Do not select this file for the card-free demo.
services:
  - type: web
    name: partsroute-web
    runtime: node
    plan: 0.5c-512mb
    region: singapore
    buildCommand: corepack enable && pnpm install --frozen-lockfile && pnpm build
    preDeployCommand: pnpm db:migrate
    startCommand: pnpm start --hostname 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 24.19.0
      - key: DATABASE_URL
        fromDatabase: { name: partsroute-db, property: connectionString }
      - key: TINYFISH_API_KEY
        sync: false
      - key: AI_PROVIDER
        value: gemini
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-3.5-flash-lite
      - key: APP_ACCESS_TOKEN
        generateValue: true
      - key: APP_ALLOWED_ORIGINS
        value: https://daksh909-design.github.io
  - type: worker
    name: partsroute-worker
    runtime: node
    plan: 0.5c-512mb
    region: singapore
    buildCommand: corepack enable && pnpm install --frozen-lockfile
    startCommand: pnpm db:migrate && pnpm worker
    envVars:
      - key: NODE_VERSION
        value: 24.19.0
      - key: DATABASE_URL
        fromDatabase: { name: partsroute-db, property: connectionString }
      - key: TINYFISH_API_KEY
        fromService:
          { type: web, name: partsroute-web, envVarKey: TINYFISH_API_KEY }
      - key: AI_PROVIDER
        value: gemini
      - key: GEMINI_API_KEY
        fromService:
          { type: web, name: partsroute-web, envVarKey: GEMINI_API_KEY }
      - key: GEMINI_MODEL
        value: gemini-3.5-flash-lite
databases:
  - name: partsroute-db
    plan: 0.1c-256mb
    region: singapore
    postgresMajorVersion: "17"
    databaseName: partsroute
    user: partsroute
    diskSizeGB: 1
    ipAllowList: []
